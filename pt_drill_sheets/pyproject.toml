[project]
name = "pt-drill-sheets"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=6.14.2",
    "typst==0.15.0",
]

[tool.uv]
# Never fetch astral's standalone CPython builds - on Linux their bundled Tk
# isn't linked against libXft/fontconfig, which causes both the X11 threading
# crash we hit on other machines and (here) unantialiased, ugly Tkinter fonts.
# Always use a system-installed interpreter, which links against the OS's own
# Tk/Xft and doesn't have either problem.
python-preference = "only-system"
